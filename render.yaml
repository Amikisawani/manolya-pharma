# Optional Render Blueprint — secrets stay in the Render dashboard.
services:
  - type: web
    name: manolya-pharma
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SCOUT_DRIVER
        value: collection
