# Manolya Pharma — Blueprint Render (web gratuit)
# Postgres gratuit recommandé : Neon (https://neon.tech) — coller DATABASE_URL / DB_*
# Doc : docs/ops/render.md

services:
  - type: web
    name: manolya-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: Manolya Pharma
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SETUP_OWNER_NAME
        value: Ami Kisawani
      - key: SETUP_OWNER_EMAIL
        value: amikisawani71@gmail.com
      - key: SETUP_OWNER_PASSWORD
        sync: false
      - key: SETUP_PHARMACY_NAME
        value: Pharmacie Manolya
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SCOUT_DRIVER
        value: collection
      - key: CURRENCY_DEFAULT
        value: CDF
      - key: CURRENCY_SYMBOL
        value: Fc
      - key: FX_USD_CDF
        value: "2350"
      - key: FX_EUR_CDF
        value: "2702.5"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Manolya Pharma
      - key: MAIL_ENCRYPTION
        value: tls
